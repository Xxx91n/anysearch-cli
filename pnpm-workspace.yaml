packages:
  - "apps/*"
  - "packages/*"
# 钉死 pnpm 版本对人+Agent 双端生效 - 版本不匹配立即报错，
# 不自动下载/改写 lockfile。本地放行: pnpm_config_pm_on_fail=download (CLI>env>yaml)。
pmOnFail: error

# audit fix: 发布龄门禁的可用形态。.npmrc 的 min-release-age=2 对 npm
# (unknown config) 与 pnpm v11 (.npmrc 仅 auth/registry) 均不生效；可用的
# pnpm key 在此，单位分钟（2880 = 2 天）。
minimumReleaseAge: 2880
# 加固：缺 time 字段的源默认跳过龄期检查（true）——置 false 收紧为 fail-closed，
# 堵「无 time 元数据」豁免面向量（E7 记档态；npmjs 恒带 time，对现状无破坏）。
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@google/genai': true
  better-sqlite3: false
  esbuild: true
  protobufjs: true
  onnxruntime-node: false #: prebuilt napi binding; install script only fetches GPU variants
  sharp: false #: transitive via transformers.js; prebuilt @img/* optional deps used

overrides:
  # #100/#46: lock zod >=4.2 so the MCP SDK v2 never hits its zod 4.0-4.1
  # bundled-fallback leg (which drops tool-schema `description`s on tools/list).
  # apps/mcp registers TypeBox schemas via fromJsonSchema() (zod-free path), and
  # the SDK's own protocol schemas need zod >=4.2 for self-conversion with
  # descriptions intact. Floor was >=3.25.28; raising it to >=4.2.0 keeps the
  # whole tree on the already-resolved 4.x line (4.4.3) and removes the 4.0-4.1
  # fallback leg from the reachable resolution set.
  zod: ">=4.2.0"
  '@deepseek-ai/cordis': 'catalog:'
  '@deepseek-ai/dsh-agent': 'catalog:'
  '@deepseek-ai/dsh-brand': 'catalog:'
  '@deepseek-ai/dsh-llm': 'catalog:'
  '@deepseek-ai/dsh-ptc-runtime': 'catalog:'
  '@deepseek-ai/dsh-sandbox': 'catalog:'
  '@deepseek-ai/dsh-sandbox-policy': 'catalog:'
  '@deepseek-ai/dsh-scope': 'catalog:'
  '@deepseek-ai/dsh-session': 'catalog:'
  '@deepseek-ai/dsh-session-persistence': 'catalog:'
  '@deepseek-ai/dsh-session-projection': 'catalog:'
  '@deepseek-ai/dsh-storage': 'catalog:'
  '@deepseek-ai/dsh-storage-domain': 'catalog:'
  '@deepseek-ai/dsh-system-prompt': 'catalog:'
  '@deepseek-ai/dsh-timeout': 'catalog:'
  '@deepseek-ai/dsh-tools': 'catalog:'
  '@deepseek-ai/dsh-typert-protocol': 'catalog:'
  '@deepseek-ai/dsh-user-approval': 'catalog:'
  '@deepseek-ai/dsh-util-values': 'catalog:'
  '@deepseek-ai/dsh-workspace': 'catalog:'

# /: dsh 上游依赖族钉版——catalog 单点承载版本号，overrides 逐名枚举
# 把全树（直接+传递）强制收敛到 catalog 值。直接依赖在 apps/dsh-plugin 用 catalog: 引用。
# 2026-11-10：锁 19 个 @deepseek-ai/dsh-*=0.2.2-rc.1 + cordis=4.1.0。
# dsh-invariants 在 0.2.2 已经退役，catalog 和 overrides 都不再列它。
# 真机验收证据见 #252 的验收评论。
catalog:
  '@deepseek-ai/cordis': 4.1.0
  '@deepseek-ai/dsh-agent': 0.2.2-rc.1
  '@deepseek-ai/dsh-brand': 0.2.2-rc.1
  '@deepseek-ai/dsh-llm': 0.2.2-rc.1
  '@deepseek-ai/dsh-ptc-runtime': 0.2.2-rc.1
  '@deepseek-ai/dsh-sandbox': 0.2.2-rc.1
  '@deepseek-ai/dsh-sandbox-policy': 0.2.2-rc.1
  '@deepseek-ai/dsh-scope': 0.2.2-rc.1
  '@deepseek-ai/dsh-session': 0.2.2-rc.1
  '@deepseek-ai/dsh-session-persistence': 0.2.2-rc.1
  '@deepseek-ai/dsh-session-projection': 0.2.2-rc.1
  '@deepseek-ai/dsh-storage': 0.2.2-rc.1
  '@deepseek-ai/dsh-storage-domain': 0.2.2-rc.1
  '@deepseek-ai/dsh-system-prompt': 0.2.2-rc.1
  '@deepseek-ai/dsh-timeout': 0.2.2-rc.1
  '@deepseek-ai/dsh-tools': 0.2.2-rc.1
  '@deepseek-ai/dsh-typert-protocol': 0.2.2-rc.1
  '@deepseek-ai/dsh-user-approval': 0.2.2-rc.1
  '@deepseek-ai/dsh-util-values': 0.2.2-rc.1
  '@deepseek-ai/dsh-workspace': 0.2.2-rc.1
