packages:
  - "apps/*"
  - "packages/*"
# ADR-0026 D5: 钉死 pnpm 版本对人+Agent 双端生效 - 版本不匹配立即报错，
# 不自动下载/改写 lockfile。本地放行: pnpm_config_pm_on_fail=download (CLI>env>yaml)。
pmOnFail: error

allowBuilds:
  '@google/genai': true
  better-sqlite3: false
  esbuild: true
  protobufjs: true
  onnxruntime-node: false  # ADR-0033: prebuilt napi binding; install script only fetches GPU variants
  sharp: false             # ADR-0033: transitive via transformers.js; prebuilt @img/* optional deps used

overrides:
  zod: ">=3.25.28"
