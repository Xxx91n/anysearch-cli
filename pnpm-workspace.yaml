packages:
  - "apps/*"
  - "packages/*"
# ADR-0026 D5: 钉死 pnpm 版本对人+Agent 双端生效 - 版本不匹配立即报错，
# 不自动下载/改写 lockfile。本地放行: pnpm_config_pm_on_fail=download (CLI>env>yaml)。
pmOnFail: error

# R63 audit fix: 发布龄门禁的可用形态。.npmrc 的 min-release-age=2 对 npm
# (unknown config) 与 pnpm v11 (.npmrc 仅 auth/registry) 均不生效；可用的
# pnpm key 在此，单位分钟（2880 = 2 天）。
minimumReleaseAge: 2880
# R78 D-002 加固：缺 time 字段的源默认跳过龄期检查（true）——置 false 收紧为 fail-closed，
# 堵「无 time 元数据」豁免面向量（E7 记档态；npmjs 恒带 time，对现状无破坏）。
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@google/genai': true
  better-sqlite3: false
  esbuild: true
  protobufjs: true
  onnxruntime-node: false  # ADR-0033: prebuilt napi binding; install script only fetches GPU variants
  sharp: false             # ADR-0033: transitive via transformers.js; prebuilt @img/* optional deps used

overrides:
  zod: ">=3.25.28"
  '@deepseek-ai/cordis': 'catalog:'
  '@deepseek-ai/dsh-agent': 'catalog:'
  '@deepseek-ai/dsh-brand': 'catalog:'
  '@deepseek-ai/dsh-invariants': 'catalog:'
  '@deepseek-ai/dsh-llm': 'catalog:'
  '@deepseek-ai/dsh-ptc-runtime': 'catalog:'
  '@deepseek-ai/dsh-sandbox': 'catalog:'
  '@deepseek-ai/dsh-sandbox-policy': 'catalog:'
  '@deepseek-ai/dsh-scope': 'catalog:'
  '@deepseek-ai/dsh-session': 'catalog:'
  '@deepseek-ai/dsh-session-persistence': 'catalog:'
  '@deepseek-ai/dsh-session-projection': 'catalog:'
  '@deepseek-ai/dsh-storage': 'catalog:'
  '@deepseek-ai/dsh-storage-domain': 'catalog:'
  '@deepseek-ai/dsh-system-prompt': 'catalog:'
  '@deepseek-ai/dsh-timeout': 'catalog:'
  '@deepseek-ai/dsh-tools': 'catalog:'
  '@deepseek-ai/dsh-typert-protocol': 'catalog:'
  '@deepseek-ai/dsh-user-approval': 'catalog:'
  '@deepseek-ai/dsh-util-values': 'catalog:'
  '@deepseek-ai/dsh-workspace': 'catalog:'

# R73 T1 / ADR-0074: dsh 上游依赖族钉版——catalog 单点承载版本号，overrides 逐名枚举
# 把全树（直接+传递）强制收敛到 catalog 值。直接依赖在 apps/dsh-plugin 用 catalog: 引用。
# R83 TE1 采纳（闸开先行，双锚齐 @2026-09-25）：锁 20 个 @deepseek-ai/dsh-*=0.1.7-rc.1
# + cordis=4.0.4。家族重推导=0.1.7 peer 闭包：新增 workspace/storage/storage-domain/
# session-persistence/sandbox/sandbox-policy/ptc-runtime 7 名；退役 code-runtime（0.1.7 线无此包）
# + util-crypto（新闭包不再引用）。升级账本：.scratch/grill-round-73/upgrade-ledger.md
# + v2 .scratch/grill-round-77/upgrade-ledger.md。
catalog:
  '@deepseek-ai/cordis': 4.0.4
  '@deepseek-ai/dsh-agent': 0.1.7-rc.1
  '@deepseek-ai/dsh-brand': 0.1.7-rc.1
  '@deepseek-ai/dsh-invariants': 0.1.7-rc.1
  '@deepseek-ai/dsh-llm': 0.1.7-rc.1
