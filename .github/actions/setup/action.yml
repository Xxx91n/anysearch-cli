# Design: collapse the repeated job bootstrap (pnpm, Node + cache, optional
# dep-age override, pnpm install) into one local composite action. Callers keep
# `actions/checkout` first because GitHub Actions needs the repo on disk before
# resolving `./.github/actions/*`; `knowledge-ranking.yml` stays separate
# because it checks out two subdirectories with no root package.json.
# Design: every varying piece stays input-driven, and `dep-age-override`
# defaults to "false" (fail-closed) so release jobs stay strict unless a job
# explicitly opts into the temporary CI bypass.

# Design: one place decides what changed (#408) — every lane used to fetch its
# own base, and a shallow fetch hides the merge base; this template unshallows
# once and takes the base from the event (pull_request: base.sha, push:
# event.before, workflow_dispatch: the default branch). A change set that cannot
# be read reports docs-only=false and runs everything. Only pull_request can be
# docs-only, so tag/dispatch releases never skip their bootstrap. The doc
# boundary itself lives in scripts/ci-changes.mjs (`docs/` plus the four root
# markdown files).
#
# Design: docs-only skips the bootstrap and every expensive step in the calling
# job — the job still registers and reports success, because the release gate
# refuses a skipped check-run and still needs every required family present
# (#406, #389 D3).

name: Setup Node, pnpm, and dependencies
description: Install pnpm from packageManager, set up Node.js with pnpm cache, optionally run the self-expiring dep-age override, and install dependencies.

outputs:
  docs-only:
    description: "'true' only when every changed file is documentation"
    value: ${{ steps.changes.outputs.docs-only }}
  changed-files:
    description: "Newline-delimited changed paths; empty when the change set cannot be read"
    value: ${{ steps.changes.outputs.changed-files }}
  changes-readable:
    description: "'true' when the changed-file list was read; 'false' means every lane must run"
    value: ${{ steps.changes.outputs.changes-readable }}

inputs:
  node-version:
    description: "Node.js version passed to actions/setup-node"
    required: false
    default: "22"
  install-args:
    description: "Space-separated flags passed to `pnpm install`"
    required: false
    default: "--ignore-scripts"
  dep-age-override:
    description: "Whether to run scripts/ci-dep-age-override.mjs before install ('true' or 'false')"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The runner's preinstalled Node runs this stdlib script; setup-node below
    # only matters for the workspace build and tests.
    - name: work out what changed
      id: changes
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -uo pipefail
        git_dir="$(git rev-parse --git-dir 2>/dev/null || true)"
        history_complete=true
        if [ -n "$git_dir" ] && [ -f "$git_dir/shallow" ]; then
          git fetch --no-tags --unshallow origin || true
        fi
        if [ -n "$git_dir" ] && [ -f "$git_dir/shallow" ]; then
          history_complete=false
          echo "::warning::could not unshallow; docs-only stays false and every lane runs"
        fi

        base=""
        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
          base="$PR_BASE_SHA"
          if [ -n "$PR_BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" || true
          fi
        elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
          base="$PUSH_BEFORE"
        elif [ -n "$DEFAULT_BRANCH" ]; then
          base="origin/$DEFAULT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" || true
        fi

        docs_only=false
        changed_files=""
        changes_readable=false
        diff_file="$(mktemp)"
        if [ -n "$base" ]; then
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base" || true
          fi
          merge_base="$(git merge-base "$base" HEAD 2>/dev/null || true)"
          if [ "$history_complete" = "true" ] && [ -n "$merge_base" ] && git diff --name-only --no-renames -z "$merge_base" HEAD > "$diff_file" 2>/dev/null; then
            changed_files="$(tr '\0' '\n' < "$diff_file")"
            changes_readable=true
            if [ "$EVENT_NAME" = "pull_request" ] && node scripts/ci-changes.mjs < "$diff_file" 2>/dev/null | grep -qx true; then
              docs_only=true
            fi
          fi
        fi
        rm -f "$diff_file"

        delim="ANS_CHANGED_FILES_${GITHUB_RUN_ID}_$RANDOM"
        {
          echo "docs-only=$docs_only"
          echo "changes-readable=$changes_readable"
          echo "changed-files<<$delim"
          if [ -n "$changed_files" ]; then printf '%s\n' "$changed_files"; fi
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2; reads packageManager (11.24.0) automatically
      if: ${{ steps.changes.outputs.docs-only != 'true' }}
      with:
        install: false

    - uses: actions/setup-node@v5
      if: ${{ steps.changes.outputs.docs-only != 'true' }}
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # Design: bypass minimumReleaseAge only via the self-expiring script, never
    # a bare env var (enforced by ship-gate E6 across workflows and actions).
    - name: dependency-age override (temporary)
      if: ${{ inputs.dep-age-override == 'true' }}
      shell: bash
      run: node scripts/ci-dep-age-override.mjs

    # Design: default `--ignore-scripts` skips all package lifecycle scripts
    # (stricter than pnpm-workspace allowBuilds); passing `install-args`
    # replaces this default rather than appending, so `--frozen-lockfile` lets
    # `allowBuilds: true` packages run their scripts again.
    - name: Install dependencies
      if: ${{ steps.changes.outputs.docs-only != 'true' }}
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        if [ -n "${INSTALL_ARGS:-}" ]; then
          IFS=' ' read -r -a args <<< "$INSTALL_ARGS"
          if [ "${#args[@]}" -gt 0 ]; then
            pnpm install "${args[@]}"
          else
            pnpm install
          fi
        else
          pnpm install
        fi
