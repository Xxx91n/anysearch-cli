# Design: collapse the repeated job bootstrap (pnpm, Node + cache, optional
# dep-age override, pnpm install) into one local composite action. Callers keep
# `actions/checkout` first because GitHub Actions needs the repo on disk before
# resolving `./.github/actions/*`; `knowledge-ranking.yml` stays separate
# because it checks out two subdirectories with no root package.json.
# Design: every varying piece stays input-driven, and `dep-age-override`
# defaults to "false" (fail-closed) so release jobs stay strict unless a job
# explicitly opts into the temporary CI bypass.

# Design: the lane list lives in scripts/ci-changes.mjs; this action exports
# docs-only and one `run-<lane>` flag for pull requests. A missing flag means
# "run" at the call site.

name: Setup Node, pnpm, and dependencies
description: Install pnpm from packageManager, set up Node.js with pnpm cache, optionally run the self-expiring dep-age override, and install dependencies.

outputs:
  docs-only:
    description: "'true' only when every changed file is documentation"
    value: ${{ steps.changes.outputs.docs-only }}
  # These names must match scripts/ci-changes.mjs LANES; the sync test checks it.
  run-check-build:
    description: "Whether the check-build lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-check-build }}
  run-spaced-path:
    description: "Whether the spaced-path lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-spaced-path }}
  run-install-smoke:
    description: "Whether the install-smoke lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-install-smoke }}
  run-test-online:
    description: "Whether the test-online lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-test-online }}
  run-test-online-anysearch:
    description: "Whether the test-online-anysearch lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-test-online-anysearch }}
  run-coverage:
    description: "Whether the coverage lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-coverage }}
  run-native-smoke:
    description: "Whether the native-smoke lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-native-smoke }}
  run-ship-gate:
    description: "Whether the ship-gate lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-ship-gate }}
  run-memory-eval:
    description: "Whether the memory-eval lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-memory-eval }}
  run-macos-spillover-probe:
    description: "Whether the macos-spillover-probe lane runs ('true' or 'false')"
    value: ${{ steps.changes.outputs.run-macos-spillover-probe }}

inputs:
  node-version:
    description: "Node.js version passed to actions/setup-node"
    required: false
    default: "22"
  install-args:
    description: "Space-separated flags passed to `pnpm install`"
    required: false
    default: "--ignore-scripts"
  dep-age-override:
    description: "Whether to run scripts/ci-dep-age-override.mjs before install ('true' or 'false')"
    required: false
    default: "false"
  detect-changes:
    description: "Whether to compute docs-only and the lane flags from the event ('true' or 'false'). Set false only where no caller reads them (release, conformance): the outputs stay empty and the checkout is not unshallowed."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The runner's preinstalled Node runs this stdlib script; setup-node below
    # only matters for the workspace build and tests.
    - name: work out what changed
      id: changes
      if: ${{ inputs.detect-changes == 'true' }}
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -uo pipefail
        emit_all_lanes() {
          node scripts/ci-changes.mjs --github --all </dev/null >> "$GITHUB_OUTPUT" \
            || echo "::warning::ci-changes could not emit lane flags; every lane runs"
        }
        # Design: push and manual dispatch run every lane; no diff to compute.
        if [ "$EVENT_NAME" != "pull_request" ]; then
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### CI lane selection"
              echo "- selected: every lane"
              echo "- reason: $EVENT_NAME event"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          emit_all_lanes
          exit 0
        fi
        git_dir="$(git rev-parse --git-dir 2>/dev/null || true)"
        history_complete=true
        if [ -n "$git_dir" ] && [ -f "$git_dir/shallow" ]; then
          # Design: blobless history keeps the name-only diff cheap — only
          # commits and trees are needed. This makes origin a promisor remote;
          # current CI git commands read only commits, trees and the working
          # tree. A plain unshallow is the fallback if git rejects the filter.
          git fetch --no-tags --filter=blob:none --unshallow origin \
            || git fetch --no-tags --unshallow origin \
            || true
        fi
        if [ -n "$git_dir" ] && [ -f "$git_dir/shallow" ]; then
          history_complete=false
          echo "::warning::could not unshallow"
        fi

        base="$PR_BASE_SHA"
        fallback_reason="no PR base"

        ci_output=""
        diff_file="$(mktemp)"
        err_file="$(mktemp)"
        if [ -n "$base" ]; then
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base" || true
          fi
          merge_base="$(git merge-base "$base" HEAD 2>/dev/null || true)"
          if [ -z "$merge_base" ]; then
            fallback_reason="no merge base"
          elif [ "$history_complete" != "true" ]; then
            fallback_reason="history incomplete"
          elif ! git diff --name-only --no-renames -z "$merge_base" HEAD > "$diff_file" 2>/dev/null; then
            fallback_reason="diff failed"
          elif ci_output="$(node scripts/ci-changes.mjs --github < "$diff_file" 2>"$err_file")"; then
            :
          else
            fallback_reason="selector failed"
            echo "::warning::ci-changes failed, treating the change set as unknown: $(tr '\n' ' ' < "$err_file")"
            ci_output=""
          fi
        fi

        # No PR base, shallow clone, or selector failure: every lane runs.
        if [ -z "$ci_output" ]; then
          rm -f "$diff_file" "$err_file"
          if [ "$fallback_reason" != "selector failed" ]; then
            echo "::warning::lane selection fell back to every lane: $fallback_reason"
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### CI lane selection"
              echo "- selected: every lane"
              echo "- fallback: $fallback_reason"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          emit_all_lanes
          exit 0
        fi
        rm -f "$diff_file" "$err_file"

        printf '%s\n' "$ci_output" >> "$GITHUB_OUTPUT"

        # Design: the job stays green when a lane is skipped; the summary names
        # what ran, what did not, and why a fallback ran everything.
        reason="$(printf '%s\n' "$ci_output" | sed -n 's/^reason=//p')"
        if [ -n "$reason" ]; then
          echo "::warning::lane selection fell back to every lane: $reason"
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          selected="$(printf '%s\n' "$ci_output" | awk -F= '/^run-.*=true$/{sub(/^run-/,"",$1); printf "%s%s", sep, $1; sep=","}')"
          skipped="$(printf '%s\n' "$ci_output" | awk -F= '/^run-.*=false$/{sub(/^run-/,"",$1); printf "%s%s", sep, $1; sep=","}')"
          {
            echo "### CI lane selection"
            echo "- selected: ${selected:-none}"
            echo "- skipped: ${skipped:-none}"
            if [ -n "$reason" ]; then echo "- fallback: $reason"; fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2; reads packageManager (11.24.0) automatically
      if: ${{ steps.changes.outputs.docs-only != 'true' }}
      with:
        install: false

    - uses: actions/setup-node@v5
      if: ${{ steps.changes.outputs.docs-only != 'true' }}
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # Design: bypass minimumReleaseAge only via the self-expiring script, never
    # a bare env var (enforced by ship-gate E6 across workflows and actions).
    - name: dependency-age override (temporary)
      if: ${{ inputs.dep-age-override == 'true' }}
      shell: bash
      run: node scripts/ci-dep-age-override.mjs

    # Design: default `--ignore-scripts` skips all package lifecycle scripts
    # (stricter than pnpm-workspace allowBuilds); passing `install-args`
    # replaces this default rather than appending, so `--frozen-lockfile` lets
    # `allowBuilds: true` packages run their scripts again.
    - name: Install dependencies
      if: ${{ steps.changes.outputs.docs-only != 'true' }}
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        if [ -n "${INSTALL_ARGS:-}" ]; then
          IFS=' ' read -r -a args <<< "$INSTALL_ARGS"
          if [ "${#args[@]}" -gt 0 ]; then
            pnpm install "${args[@]}"
          else
            pnpm install
          fi
        else
          pnpm install
        fi
