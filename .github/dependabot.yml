version: 2
updates:
  # Only manage GitHub Actions here — npm/pnpm dependencies follow the repo's
  # own lockfile and minimumReleaseAge discipline.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
