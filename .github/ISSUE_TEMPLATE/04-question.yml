name: 使用咨询
description: 配置不会弄、宿主接不上、不确定某个功能怎么用，可以直接来问
title: "[question] "
labels:
  - question
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        发问前可以先翻一下 [使用说明](https://github.com/Xxx91n/anysearch-cli/blob/main/README.zh-CN.md) 和 [已知限制文档](https://github.com/Xxx91n/anysearch-cli/blob/main/docs/limitations.md)；没找到答案的话，把背景说清楚我们尽量帮着看。

        **提醒**：贴配置或终端输出前，请先把 API Key、令牌等私密内容删掉或打码。

  - type: dropdown
    id: topic
    attributes:
      label: 想问哪方面的问题？
      options:
        - 安装、升级与凭据配置
        - 领域配置、信息源与域过滤
        - MCP 服务与工具调用
        - 宿主接入与钩子
        - 记忆、对话恢复与知识整理
        - 其他
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 你想做什么，卡在哪一步了？
      description: 尽量把你的目标、用到的命令或配置写清楚。
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已经试过什么办法？（选填）
      description: 比如跑过 `ans doctor` 看到什么、改过哪些配置、查过哪篇文档。
    validations:
      required: false
