name: 功能建议
description: 想要新功能、觉得某个流程用着不顺手，或者希望支持新的宿主或信息源
title: "[feat] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法！把你真实遇到的使用场景讲明白，比一上来写死方案更有帮助，方便大家一起商量最合适的做法。

  - type: dropdown
    id: area
    attributes:
      label: 这个建议和哪一块有关？
      options:
        - 命令行（ans）
        - MCP 服务（ans-mcp）
        - 宿主接入与钩子（Claude Code / Codex / CodeBuddy / Antigravity / dsh 等）
        - 检索、信息源与域过滤
        - 记忆、对话恢复与知识整理
        - 安装、升级与分层诊断（ans doctor / ans upgrade）
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你现在遇到什么不方便的地方？
      description: 说说你在什么场景下卡住了，或者缺了哪项能力。
      placeholder: 例如：我每次切换项目都要手动改……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望做成什么样？（选填）
      description: 如果你已经有想法，可以讲讲理想中的命令、交互方式或效果；还没想好也可以先留空。
      placeholder: 例如：希望能加一个参数 / 子命令，跑完后直接输出……
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 临时替代办法或其他补充（选填）
      description: 你现在是怎么绕过去的？或者有没有参考例子、截图、相关 issue？
    validations:
      required: false
