# TEMPORARY diagnostic lane for #183 (deleted before merge).
#
# The macOS ship-gate leg failed on PR #191 and Actions job logs are not
# reachable from this session's network, so the gate output is mirrored into a
# PR comment (readable over the API). Not part of the gate: distinct workflow
# name, no required-leg family match, branch-push/dispatch only.
#
# Delete this file once the #183 diagnosis is recorded.

name: macos-store-diag

on:
  # A workflow file that is not on the default branch cannot be dispatched, so
  # this lane fires on a push to the #183 branch instead (it is deleted before
  # merge, so it can never fire on main).
  push:
    branches: [arena/af6db14d-anysearch-cli]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v2
        with: { install: false }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: install (no scripts — better-sqlite3 prebuilt)
        run: pnpm install --ignore-scripts

      - name: capture store suite + gate output (never fails the job)
        run: |
          set +e
          {
            echo "=== node -v ==="
            node -v
            echo
            echo "=== pnpm -C packages/store test (store suite, 30s/file timeout) ==="
            pnpm -C packages/store test
            echo "STORE_TEST_EXIT=$?"
            echo
            echo "=== node scripts/ship-gate.mjs ==="
            CI=true NODE_OPTIONS="--test-reporter=spec" node scripts/ship-gate.mjs
            echo "SHIP_GATE_EXIT=$?"
          } > /tmp/diag.log 2>&1
          exit 0

      - name: mirror output to the PR (API-readable)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: "191"
        run: |
          total=$(wc -c < /tmp/diag.log)
          {
            echo "### macos-store-diag capture ($total bytes)"
            echo ""
            echo '```'
            tail -c 45000 /tmp/diag.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md

      - name: annotate the first failure lines
        run: |
          grep -nE "libc++abi|mutex lock failed|not ok|✖|FAIL|Error:|error TS|STORE_TEST_EXIT=|SHIP_GATE_EXIT=" /tmp/diag.log \
            | tail -n 10 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done || true
