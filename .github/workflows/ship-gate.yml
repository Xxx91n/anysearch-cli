# — Product Smoke Gate (blocking).
# Runs scripts/ship-gate.mjs; merge and tag are gated on this workflow.

name: ship-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_matrix:
        description: "Skip cross-OS matrix install (CI matrix only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ship-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ship-gate:
    name: ship-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest RESTORED to the BLOCKING matrix (#16) — the exit-time
        # libc++abi family was fixed at the teardown seam (explicit teardown
        # replaced the racy process.exit, fd249d41) and the promotion rule was
        # met: >=5 consecutive green probes ran the full chain (registration ->
        # build -> exit-probe) after the #107 probe-path fix — verified window
        # runs 41840345806..41850289669 (2026-11-04, 7 consecutive completed
        # greens, zero crash signatures; every sampled post-fix probe run
        # 2026-11-03 onward came back green). The non-blocking spillover
        # probe hit its TTL and was retired with this promotion. If the family
        # re-manifests here, prune the lane again and re-probe per the rule
        # recorded in docs/limitations.md — the probe job and
        # scripts/macos-exit-probe.mjs are retired with this commit and must
        # be recovered from git history (last present at 73ada6b0).
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # full history checkout kept for headroom (index/supersession legs read the
      # committed tree; diff-based jobs benefit). 2026-10-13: SHA-resolving leg retired.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/setup@v2 #: reads packageManager (11.24.0) automatically
        with:
          install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: install (no scripts — better-sqlite3 prebuilt, see pnpm-workspace allowBuilds)
        run: pnpm install --ignore-scripts

      - name: ship-gate (9 steps; matrix install runs per-OS in CI)
        run: node scripts/ship-gate.mjs
        env:
          CI: "true"
          NODE_OPTIONS: "--test-reporter=spec"

      # — Layer-2 artifact upload, runs even when ship-gate fails.
      - name: upload ship-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ship-gate-${{ matrix.os }}
          path: .ship-gate/
          # atomcode 评审 #1: upload-artifact 自 2024-09-02 (issue #602) 默认
          # 排除 hidden files/dirs;.ship-gate/ 是点目录,需显式打开。
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # golden memory-eval as a dedicated path-filtered job (signal fast,
  # avoid paying eval cost for doc/CI-only diffs). ship-gate above stays the merge gate.
  memory-eval:
    name: memory-eval (golden, path-filtered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: path filter (packages/store/**, eval scripts)
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            # on workflow_dispatch github.event.before is empty, so
            # `git diff --name-only "..HEAD"` resolves to HEAD-vs-worktree (always empty) and the
            # job silently skipped. Fall back to HEAD's own file list so the memory-eval signal is
            # reachable outside push/PR events.
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              files=$(git diff --name-only "${{ github.event.before }}..HEAD")
            else
              # workflow_dispatch: the branch-vs-default-branch diff is the correct scope (the job
              # asks "does THIS branch touch packages/store?", not "what did the last commit do").
              git fetch origin "${{ github.event.repository.default_branch }}" --depth=1 || true
              files=$(git diff --name-only "origin/${{ github.event.repository.default_branch }}...HEAD" || git show --pretty=format: --name-only HEAD)
            fi
          fi
          if grep -Eq '^(packages/store/|scripts/eval-(judge|calibrate)\.mjs$)' <<< "$files"; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/setup@v2
        if: ${{ steps.changes.outputs.run == '1' }}
        with: { install: false }

      - uses: actions/setup-node@v5
        if: ${{ steps.changes.outputs.run == '1' }}
        with: { node-version: 22, cache: pnpm }

      - name: install
        if: ${{ steps.changes.outputs.run == '1' }}
        run: pnpm install --ignore-scripts

      - name: memory eval (golden gate, /0028)
        if: ${{ steps.changes.outputs.run == '1' }}
        # round-59 audit R-2: the golden gate runs the offline slice; the vector-arm slice is
        # re-established by the test-online job in ci.yml.
        run: pnpm -C packages/store eval --offline

