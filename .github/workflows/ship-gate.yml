# ADR-0020 D1 — Product Smoke Gate (blocking).
# Runs scripts/ship-gate.mjs; merge and tag are gated on this workflow.

name: ship-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_matrix:
        description: "Skip cross-OS matrix install (CI matrix only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ship-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ship-gate:
    name: ship-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v2 # ADR-0026 D6: reads packageManager (11.24.0) automatically
        with:
          install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: install (no scripts — better-sqlite3 prebuilt, see pnpm-workspace allowBuilds)
        run: pnpm install --ignore-scripts

      - name: ship-gate (5 steps; matrix install runs per-OS in CI)
        run: node scripts/ship-gate.mjs
        env:
          CI: "true"

      # ADR-0021 D4 — Layer-2 artifact upload, runs even when ship-gate fails.
      - name: upload ship-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ship-gate-${{ matrix.os }}
          path: .ship-gate/
          # atomcode 评审 #1: upload-artifact 自 2024-09-02 (issue #602) 默认
          # 排除 hidden files/dirs;.ship-gate/ 是点目录,需显式打开。
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
