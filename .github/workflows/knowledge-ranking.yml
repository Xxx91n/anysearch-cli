name: knowledge-ranking
on:
  pull_request:
    paths:
      - 'packages/store/**'
      - 'packages/retriever/**'
      - 'scripts/compare-knowledge-ranking.mjs'
      - '.github/workflows/knowledge-ranking.yml'
  workflow_dispatch:
concurrency:
  group: knowledge-ranking-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          path: baseline
          # #283 starting point; do not move this to the latest main.
          ref: 51a9ec9c9c95c6a9a1bee0966843ca2a150d0086
      # Neither checkout sits at the repo root, so there is no root package.json:
      # point the action at candidate/ to read its packageManager.
      # `install: false`: the installs belong to the step below.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          working-directory: candidate
          install: false
          # Design: cache: true with both lockfiles in the key — the cache holds
          # pnpm's store, not node_modules, so one store serves both installs, and
          # the paths stay repo-root-relative (not relative to working-directory).
          cache: true
          cache-dependency-path: |
            candidate/pnpm-lock.yaml
            baseline/pnpm-lock.yaml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install both revisions without build scripts
        run: |
          (cd candidate && node scripts/ci-dep-age-override.mjs && pnpm install --ignore-scripts)
          (cd baseline && node scripts/ci-dep-age-override.mjs && pnpm install --ignore-scripts)
      - name: Run identical offline cases against both revisions
        shell: bash
        run: |
          mkdir -p baseline/packages/store/test/fixtures
          cp candidate/packages/store/test/fixtures/{eval-knowledge-ranking.ts,knowledge-ranking-cases.json} baseline/packages/store/test/fixtures/
          (cd baseline/packages/store && pnpm exec tsx test/fixtures/eval-knowledge-ranking.ts "$RUNNER_TEMP/ranking-base.json")
          (cd candidate/packages/store && pnpm exec tsx test/fixtures/eval-knowledge-ranking.ts "$RUNNER_TEMP/ranking-head.json")
          node candidate/scripts/compare-knowledge-ranking.mjs "$RUNNER_TEMP/ranking-base.json" "$RUNNER_TEMP/ranking-head.json" | tee "$RUNNER_TEMP/ranking-comparison.txt"
      - name: Verify the comparison pipeline rejects worse metrics
        shell: bash
        run: |
          node --input-type=module - "$RUNNER_TEMP/ranking-head.json" "$RUNNER_TEMP/ranking-regressed.json" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const metrics = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          metrics.mixed.ndcgAt10 = 0;
          writeFileSync(process.argv[3], JSON.stringify(metrics));
          NODE
          if node candidate/scripts/compare-knowledge-ranking.mjs "$RUNNER_TEMP/ranking-base.json" "$RUNNER_TEMP/ranking-regressed.json" | tee "$RUNNER_TEMP/ranking-negative-control.txt"; then
            echo "::error::The comparison pipeline accepted worse metrics"
            exit 1
          fi
          echo "Confirmed: worse metrics make the comparison pipeline fail"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: knowledge-ranking-by-language
          path: ${{ runner.temp }}/ranking-*
