name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ponytail: matrix trimmed to ubuntu+windows (mac only differs in arm64 binary, covered
# by better-sqlite3 prebuild). Add macos-latest when a mac user reports a real issue.
jobs:
  check-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2; reads packageManager (11.24.0) automatically
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # ponytail: --ignore-scripts required because better-sqlite3 ships prebuilds
      # and our allowBuilds=false pnpm-workspace.yaml entry is intentional.
      # Temporary dependency-age bypass for #260; self-expires (see the script).
      - name: dependency-age override (temporary)
        run: node scripts/ci-dep-age-override.mjs
      - run: pnpm install --ignore-scripts
      - name: Validate calibration labels
        run: node scripts/eval-labels.mjs validate
      - name: Preflight selection tests
        run: node --test "scripts/test/preflight-*.test.mjs"
      - run: pnpm -w turbo check
      - name: "Test — all packages (node:test discovery, full truth)"
        run: pnpm -w turbo run test --continue=dependencies-successful
        env:
          NODE_OPTIONS: "--test-reporter=spec"
      - run: pnpm -w turbo build

      - name: Pack tarballs
        run: |
          pnpm --filter @anysearch-cli/mcp pack --pack-destination artifacts
          pnpm --filter @anysearch-cli/cli pack --pack-destination artifacts
          pnpm --filter @anysearch-cli/plugin pack --pack-destination artifacts
        shell: bash

      - name: Smoke — apps/mcp --help + 5-tool stdio & Streamable HTTP (#100)
        shell: bash
        run: |
          node apps/mcp/dist/index.js --help
          # #100: full 5-tool smoke on BOTH transports (stdio + stateless Streamable
          # HTTP) against the built dist — type descriptions intact (#46), two-generation
          # protocol negotiation unchanged (legacy echo + 2026-07-28 -> 2025-11-25). tools/list
          # only, so no provider/LLM keys are required.
          node scripts/mcp-smoke.mjs

      - name: Smoke — apps/cli --help
        run: node apps/cli/dist/index.js --help

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs-${{ matrix.os }}
          path: artifacts/*.tgz
          if-no-files-found: error

  # Design: test apps/plugin from a copy of the workspace placed at a path with a
  # space and Chinese characters — every other lane checks out into a pure-ASCII
  # path, so a path-encoding bug stays green there.
  #
  # Advisory: this lane does not gate releases (AGENTS.md, Gate rules).
  spaced-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Same install as check-build; the dependency-age override is temporary.
      - name: dependency-age override (temporary)
        run: node scripts/ci-dep-age-override.mjs
      - run: pnpm install --ignore-scripts

      # Design: copy instead of reinstall — pnpm links are relative, so the copy
      # resolves into its own store. `.git` stays behind; no test reads it. This
      # lane covers runtime path handling only, not the install step.
      - name: Copy workspace to a spaced + non-ASCII path
        shell: bash
        run: |
          SPACED="$(dirname "$GITHUB_WORKSPACE")/ans space 空格/repo"
          case "$SPACED" in
            *" "*"空格"*) ;;
            *) echo "SPACED must keep a space and 空格: $SPACED"; exit 1 ;;
          esac
          echo "spaced path: $SPACED"
          mkdir -p "$SPACED"
          rsync -aH --exclude .git "$GITHUB_WORKSPACE"/ "$SPACED"/
          echo "SPACED=$SPACED" >> "$GITHUB_ENV"

      # Design: the package's own `test`, not turbo — turbo's cacheable `build`
      # could hand the copy dist built at the original checkout, skipping a rebuild.
      - name: Plugin tests inside the spaced path
        shell: bash
        run: pnpm -C "$SPACED/apps/plugin" test

  # B2/T2: install-to-use lane against the REAL packed artifacts —
  # the historical gap that let 0.0.0 tarballs sit stale. Packs all seven
  # packages, npm-installs them into a clean prefix, and drives the installed
  # `ans` bin through doctor / domain / search. Online search assertions fire
  # only when EXA_API_KEY / TAVILY_API_KEY secrets exist; offline asserts the
  # documented no-results path. macOS stays excluded per the ponytail note
  # above (arm64 better-sqlite3 prebuild delta only).
  install-smoke:
    name: "install-smoke (B2: pack -> clean install -> doctor -> domain -> search)"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Temporary dependency-age bypass for #260; self-expires (see the script).
      - name: dependency-age override (temporary)
        run: node scripts/ci-dep-age-override.mjs
      - run: pnpm install --ignore-scripts
      - run: pnpm -w turbo build
      - name: install-smoke lane
        run: node scripts/install-smoke.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # #259: cross-session recall at the product entry, against the dist this
      # job just built. Lane 1 needs no model credentials (it writes the archive
      # and recalls it through the real query_knowledge tool); lane 2 exercises
      # the real ans_chat path only when LLM env is present, and prints SKIPPED
      # otherwise rather than pretending it passed.
      - name: recall acceptance lane (#259)
        run: node scripts/recall-acceptance.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # #267 (T6): install-smoke above only drove CLI commands. This lane packs
      # and installs its OWN copy of the same app packages, then proves that
      # install can be used as a product: start the INSTALLED MCP server, run a
      # real ans_chat turn and its resumed continuation against a local SSE stub,
      # consolidate selected materials, check the internal search's rows are
      # recallable by another session, and open an older database (migrate, keep
      # rows, migrate again). It packs separately because install-smoke deletes
      # its tarballs on exit; the artifact is the same source tree either way. A
      # missing provider key prints SKIPPED for that one lane instead of a pass.
      - name: installed acceptance lane (#267)
        run: node scripts/installed-acceptance.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # 解析器自测：不需要搜索 key，也不用装包，几秒跑完。
      # 它喂一个 RetrievalContent 形状（results 藏在 snippet 的 JSON 里）给 E 车道
      # 那个解析函数。真实搜索大多走裸 envelope，那条分支靠真跑碰不到，所以单独在
      # 这里钉住；改坏了立刻红。
      - name: acceptance parser self-test (#267)
        run: node scripts/installed-acceptance.mjs --self-test-parser

  # round-59 audit R-2 / + r59 errata: the vector-arm golden cases left
  # the offline default suite (the gate runs --offline); this job re-establishes that coverage
  # with network access, so the anti-downgrade clause has automated support.
  # round-59 audit: also runs the embedding model tests (packages/embedding test:online),
  # which had no CI home, so the online-gated coverage is complete.
  test-online:
    name: "test:online (online-gated: store vector-arm + embedding, network required)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Temporary dependency-age bypass for #260; self-expires (see the script).
      - name: dependency-age override (temporary)
        run: node scripts/ci-dep-age-override.mjs
      - run: pnpm install --ignore-scripts
      - name: vector-arm golden cases (store test:online)
        run: pnpm -C packages/store test:online
        env:
          NODE_OPTIONS: "--test-reporter=spec"
      - name: embedding model tests (embedding test:online)
        run: pnpm -C packages/embedding test:online
        env:
          NODE_OPTIONS: "--test-reporter=spec"

  # (branch b): provider live-search probe — the watershed the
  # diagnosis exposed (no CI surface ever touched api.anysearch.com). This
  # job is continue-on-error by contract: an external endpoint must never gate
  # the pipeline (§5 two-layer probes, live-path; the fail-path stays in
  # install-smoke via the dead-port injection).
  test-online-anysearch:
    name: "test:online anysearch /mcp live probe (non-blocking)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Temporary dependency-age bypass for #260; self-expires (see the script).
      - name: dependency-age override (temporary)
        run: node scripts/ci-dep-age-override.mjs
      - run: pnpm install --ignore-scripts
      - name: anysearch MCP live probe (retriever test:online)
        run: pnpm -C packages/retriever test:online
        env:
          NODE_OPTIONS: "--test-reporter=spec"
