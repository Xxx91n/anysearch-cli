name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ponytail: matrix trimmed to ubuntu+windows (mac only differs in arm64 binary, covered
# by better-sqlite3 prebuild). Add macos-latest when a mac user reports a real issue.
jobs:
  check-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2 # ADR-0026 D6: reads packageManager (=11.24.0) automatically
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # ponytail: --ignore-scripts required because better-sqlite3 ships prebuilds
      # and our allowBuilds=false pnpm-workspace.yaml entry is intentional (ADR-0017).
      - run: pnpm install --ignore-scripts
      - name: Validate calibration labels (ADR-0048)
        run: node scripts/eval-labels.mjs validate
      - run: pnpm -w turbo check
      - name: "Test — all packages (ADR-0057 D1/D2: node:test discovery, full truth)"
        run: pnpm -w turbo run test --continue=dependencies-successful
        env:
          NODE_OPTIONS: "--test-reporter=spec"
      - run: pnpm -w turbo build

      - name: Pack tarballs
        run: |
          pnpm --filter @anysearch/mcp pack --pack-destination artifacts
          pnpm --filter @anysearch/cli pack --pack-destination artifacts
          pnpm --filter @anysearch/plugin pack --pack-destination artifacts
        shell: bash

      - name: Smoke — apps/mcp --help and protocol handshake
        shell: bash
        run: |
          node apps/mcp/dist/index.cjs --help
          # minimal MCP handshake (initialize + tools/list over stdio)
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node apps/mcp/dist/index.cjs --transport stdio \
            | grep -q '"search_web"'

      - name: Smoke — apps/cli --help
        run: node apps/cli/dist/index.js --help

      - uses: actions/upload-artifact@v4
        with:
          name: tarballs-${{ matrix.os }}
          path: artifacts/*.tgz
          if-no-files-found: error
  # ADR-0061 B2/T2: install-to-use lane against the REAL packed artifacts —
  # the historical gap that let 0.0.0 tarballs sit stale. Packs all seven
  # packages, npm-installs them into a clean prefix, and drives the installed
  # `ans` bin through doctor / domain / search. Online search assertions fire
  # only when EXA_API_KEY / TAVILY_API_KEY secrets exist; offline asserts the
  # documented no-results path. macOS stays excluded per the ponytail note
  # above (arm64 better-sqlite3 prebuild delta only).
  install-smoke:
    name: "install-smoke (ADR-0061 B2: pack -> clean install -> doctor -> domain -> search)"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --ignore-scripts
      - run: pnpm -w turbo build
      - name: install-smoke lane
        run: node scripts/install-smoke.mjs
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  # round-59 audit R-2 / ADR-0060 D7 + ADR-0057 r59 errata: the vector-arm golden cases left
  # the offline default suite (the gate runs --offline); this job re-establishes that coverage
  # with network access, so the anti-downgrade clause has automated support.
  # round-59 audit D-3: also runs the embedding model tests (packages/embedding test:online),
  # which had no CI home, so the online-gated coverage is complete.
  test-online:
    name: "test:online (online-gated: store vector-arm + embedding, network required)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --ignore-scripts
      - name: vector-arm golden cases (store test:online)
        run: pnpm -C packages/store test:online
        env:
          NODE_OPTIONS: "--test-reporter=spec"
      - name: embedding model tests (embedding test:online)
        run: pnpm -C packages/embedding test:online
        env:
          NODE_OPTIONS: "--test-reporter=spec"
