# ADR-0020 D2 — Non-Blocking Conformance Heartbeat.
# Tracks MCP spec drift (currently targeting 2025-11-25; 2026-07-28 RC is in
# flight, see ADR-0018). Result is surfaced via step summary + artifact;
# never blocks main or release. Promotion to blocking requires a new ADR.

name: conformance-heartbeat

on:
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: mcp-conformance (anysearch-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install + build
        run: |
          pnpm install --ignore-scripts
          pnpm turbo run build

      - name: start MCP server (Streamable HTTP, port 3001)
        run: |
          node apps/mcp/dist/index.cjs --transport http --port 3001 &
          echo $! > /tmp/ans-mcp.pid
          # naive readiness: conformance runner will retry on its own
          sleep 3
          curl -sSf -X POST http://127.0.0.1:3001/mcp \
            -H "content-type: application/json" \
            -d '{"jsonrpc":"2.0","id":0,"method":"ping"}' || true

      - name: run conformance (non-blocking; baseline suppresses known drifts)
        id: conformance
        continue-on-error: true
        run: |
          npx -y @modelcontextprotocol/conformance@0.1.16 \
            --url http://127.0.0.1:3001/mcp \
            --expected-failures .github/conformance-expected-failures.yml \
            --json-out conformance-results.json || true

      - name: summarize
        if: always()
        run: |
          echo "## MCP Conformance Heartbeat" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Spec target: 2025-11-25 (stable). RC 2026-07-28 tracked in ADR-0018." >> "$GITHUB_STEP_SUMMARY"
          if [ -f conformance-results.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -c 4000 conformance-results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no results file produced)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-${{ github.run_number }}
          path: conformance-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: stop MCP server
        if: always()
        run: kill "$(cat /tmp/ans-mcp.pid)" 2>/dev/null || true
