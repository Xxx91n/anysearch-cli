name: Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Design: #407 — unified from pnpm/action-setup@v4 + setup-node@v4 onto the
      # shared setup template; verified identical runtime versions (pnpm 11.24.0,
      # Node 22.x) and cache key while keeping --frozen-lockfile unchanged.
      - uses: ./.github/actions/setup
        with:
          install-args: --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: "**/coverage/lcov.info"
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
