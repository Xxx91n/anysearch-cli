# Native Smoke Matrix (consumer variant of better-sqlite3 build.yml).
# Native loading + owned probe-process cleanup. No package build.
# Windows probe ownership uses the built-in PowerShell/.NET job API.
# pnpm-workspace.yaml pins allowBuilds: better-sqlite3=false — a missing prebuild must
# fail loudly here rather than being papered over by a silent node-gyp source build.
name: native-smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: darwin-arm64
          - os: windows-latest
            label: win32-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          install-args: --frozen-lockfile
          dep-age-override: true
      # Design: docs-only PRs skip both probes — the job still reports success,
      # so every matrix leg registers without paying native-test time (#408).
      - name: Verify probe process-tree cleanup
        if: ${{ steps.setup.outputs.docs-only != 'true' }}
        run: node --test scripts/test/probe-process.test.mjs
      - name: Verify native prebuild loads (${{ matrix.label }})
        if: ${{ steps.setup.outputs.docs-only != 'true' }}
        run: node scripts/verify-native.mjs
