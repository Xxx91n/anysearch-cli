# Native Smoke Matrix (consumer variant of better-sqlite3 build.yml).
# Native loading + owned probe-process cleanup. No package build.
# Windows probe ownership uses the built-in PowerShell/.NET job API.
# pnpm-workspace.yaml pins allowBuilds: better-sqlite3=false — a missing prebuild must
# fail loudly here rather than being papered over by a silent node-gyp source build.
name: native-smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: darwin-arm64
          - os: windows-latest
            label: win32-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v2; reads packageManager (11.24.0) automatically
        with: { install: false }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Verify probe process-tree cleanup
        run: node --test scripts/test/probe-process.test.mjs
      # Temporary dependency-age bypass for #260; self-expires (see the script).
      - name: dependency-age override (temporary)
        run: node scripts/ci-dep-age-override.mjs
      - name: Install (frozen-lockfile, builds disabled)
        run: pnpm install --frozen-lockfile
      - name: Verify native prebuild loads (${{ matrix.label }})
        run: node scripts/verify-native.mjs
