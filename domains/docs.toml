# Docs domain — technical-docs retrieval wedge (B1, spec .scratch/grill-round-60/spec-b1.md).
# Corpus anchored on first-party docs the team depends on daily (inclusion rule).
# urlAllowlist gates URL *consumption* (policy/HITL), not search ranking.
name = "docs"
description = "Technical-docs retrieval: MCP spec / TypeScript tsconfig / pnpm settings (first-party corpus)"

[settings]
language = "TypeScript"
depth = "docs"

[skills]
active = ["search", "doctor"]

[sources]
enabled = ["tavily", "exa", "anysearch"]
# First-party corpus (first-batch instance, bare hostnames only).
urlAllowlist = ["modelcontextprotocol.io", "typescriptlang.org", "www.typescriptlang.org", "pnpm.io"]

[rag]
adapter = "none"

[hooks]
# 宿主接了读页 provider、又有能写正文的 store，内部 chat 才注册 fetch；
# 域策略要放行，宿主也不能已有同名 fetch 工具；声明 skills.toolRequires 时把 fetch 列进去。
toolWhitelist = ["search", "fetch"]
